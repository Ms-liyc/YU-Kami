# 开发环境：仅启动 PostgreSQL + Redis
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yukami-postgres
    environment:
      POSTGRES_DB: yukami
      POSTGRES_USER: yukami
      POSTGRES_PASSWORD: yukami123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  redis:
    image: redis:7-alpine
    container_name: yukami-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
