# 开发环境：仅启动 MySQL + Redis
version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: yukami-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: yukami
      MYSQL_USER: yukami
      MYSQL_PASSWORD: yukami123
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uyukami", "-pyukami123"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yukami-redis
    ports:
      - "6379:6379"

volumes:
  mysqldata:
