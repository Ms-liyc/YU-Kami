version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yukami-postgres
    environment:
      POSTGRES_DB: yukami
      POSTGRES_USER: yukami
      POSTGRES_PASSWORD: yukami123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yukami"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - yukami-net

  redis:
    image: redis:7-alpine
    container_name: yukami-redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - yukami-net

  backend:
    build: ./backend
    container_name: yukami-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: yukami
      DB_USER: yukami
      DB_PASSWORD: yukami123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: YuChen-Kami-Docker-JWT-Secret-Change-In-Production
      HMAC_SECRET: YuChen-HMAC-Docker-Secret-Change-In-Production
      AES_KEY: YuChenAES256KeyChangeInProd!!
      # 环境变量模板见项目根目录 .env.example
      # 支付对接（可选）：按你的公网域名自行配置，详见 docs/PAYMENT.md
      # PAYMENT_BASE_URL: https://your-domain.com
      # PAYMENT_RETURN_URL: https://your-domain.com/shop/orders
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - yukami-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: yukami-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - yukami-net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  yukami-net:
    driver: bridge
