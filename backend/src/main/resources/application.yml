server:
  port: 8080

spring:
  application:
    name: yu-kami
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yukami}
    username: ${DB_USER:yukami}
    password: ${DB_PASSWORD:yukami123}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

yukami:
  jwt:
    secret: ${JWT_SECRET:YuChen-Kami-Enterprise-JWT-Secret-Key-Change-In-Production-2026}
    expiration-ms: 86400000
  crypto:
    hmac-secret: ${HMAC_SECRET:YuChen-HMAC-Master-Secret-Change-In-Production}
    aes-key: ${AES_KEY:YuChenAES256KeyChangeInProd!!}
    rsa-private-key-path: ${RSA_PRIVATE_KEY:}
    rsa-public-key-path: ${RSA_PUBLIC_KEY:}
  redeem:
    rate-limit-per-minute: 30
    lock-ttl-seconds: 10
  card:
    default-length: 20
    charset: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
  payment:
    # 支付回调/跳转地址：无固定值，部署者按实际环境通过环境变量配置（见 docs/PAYMENT.md）
    base-url: ${PAYMENT_BASE_URL:http://localhost:8080}
    return-url: ${PAYMENT_RETURN_URL:http://localhost:5173/shop/orders}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.yuchen.kami: INFO
