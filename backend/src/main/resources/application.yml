server:
  port: 8080

spring:
  application:
    name: yu-kami
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yukami}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:change-me-db-password}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

yukami:
  jwt:
    secret: ${JWT_SECRET:YuChen-Kami-Enterprise-JWT-Secret-Key-Change-In-Production-2026}
    expiration-ms: 86400000
  crypto:
    hmac-secret: ${HMAC_SECRET:YuChen-HMAC-Master-Secret-Change-In-Production}
    aes-key: ${AES_KEY:YuChenAES256KeyChangeInProd!!}
    rsa-private-key-path: ${RSA_PRIVATE_KEY:}
    rsa-public-key-path: ${RSA_PUBLIC_KEY:}
  redeem:
    rate-limit-per-minute: 30
    lock-ttl-seconds: 10
  card:
    default-length: 20
    charset: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
  stock:
    low-threshold: ${STOCK_LOW_THRESHOLD:10}
    alert-email: ${STOCK_ALERT_EMAIL:}
  payment:
    # 支付回调/跳转地址：无固定值，部署者按实际环境通过环境变量配置（见 docs/PAYMENT.md）
    base-url: ${PAYMENT_BASE_URL:http://localhost:8080}
    return-url: ${PAYMENT_RETURN_URL:http://localhost:5173/shop/orders}
    mock-enabled: ${MOCK_PAYMENT_ENABLED:true}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://127.0.0.1:5173}
    swagger-enabled: ${SWAGGER_ENABLED:true}
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT:20}
    register-rate-limit-per-minute: ${REGISTER_RATE_LIMIT:5}
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
  mail:
    from: ${MAIL_FROM:}
    app-url: ${APP_URL:http://localhost:5173}
  feature-schema-migration:
    enabled: ${FEATURE_SCHEMA_MIGRATION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.yuchen.kami: INFO
